services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: offline-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/postgresql/data:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 256mb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  n8n:
    image: ${N8N_IMAGE}
    container_name: offline-n8n-app
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_FQDN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_FQDN}:${N8N_HTTPS_PORT}
      WEBHOOK_URL: https://${N8N_FQDN}:${N8N_HTTPS_PORT}/
      N8N_TRUST_PROXY: "true"
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_TIMEZONE: ${N8N_TIMEZONE}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/n8n/data:/home/node/.n8n
    networks:
      - backend
      - frontend
    expose:
      - "5678"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  caddy:
    image: ${CADDY_IMAGE}
    container_name: offline-n8n-caddy
    restart: unless-stopped
    ports:
      - "${N8N_HTTP_PORT}:80"
      - "${N8N_HTTPS_PORT}:443"
    volumes:
      - ../certs:/certs:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/caddy/data:/data
      - /opt/caddy/config:/config
    networks:
      - frontend
    depends_on:
      - n8n
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  frontend:
  backend:
